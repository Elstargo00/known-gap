services:
  known-gap:
    build:
      context: .
      target: dev
    container_name: known-gap
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://known_gap:known_gap@postgres:5432/known_gap
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      FALKORDB_USERNAME: ""
      FALKORDB_PASSWORD: ""
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      falkordb:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg17
    container_name: known-gap-postgres
    environment:
      POSTGRES_USER: known_gap
      POSTGRES_PASSWORD: known_gap
      POSTGRES_DB: known_gap
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/known_gap/infrastructure/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U known_gap -d known_gap"]
      interval: 5s
      timeout: 3s
      retries: 10

  falkordb:
    image: falkordb/falkordb:latest
    container_name: known-gap-falkordb
    ports:
      - "6380:6379"
      - "3001:3000"  # FalkorDB browser UI — moved off 3000 so Next.js dev can use it
    volumes:
      - falkordb-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  falkordb-data:
