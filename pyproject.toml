[project]
name = "known-gap"
version = "0.1.0"
description = "A knowledge-gap-aware Q&A platform that tailors answers to each user's personal knowledge graph."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.9.0",
    "structlog>=25.3.0",
    "asyncpg>=0.31.0",
    "pgvector>=0.4.2",
    "voyageai>=0.3.7",
    "pypdf>=6.10.2",
    "python-multipart>=0.0.26",
    "tenacity>=9.1.4",
    "anthropic>=0.96.0",
    "google-genai>=1.73.1",
    "falkordb>=1.6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=6.1.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.15.8",
    "ty>=0.0.26",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "N", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/known_gap/shared/exceptions/base.py" = ["N818"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.ty.environment]
root = ["."]

[tool.ty.rules]
all = "warn"

[[tool.ty.overrides]]
include = ["src/**"]

[tool.ty.overrides.rules]
possibly-unresolved-reference = "error"

[tool.ty.terminal]
error-on-warning = false
output-format = "full"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: requires live external connections",
    "slow: long-running tests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/known_gap"]
